ão fetal; evitar pirimetamina no 1º trimestre", "Carne bem cozida, lavar vegetais, luvas com solo e caixa de areia; notificação semanal"]], ["Leishmaniose visceral", "t", ["L. infantum; flebotomíneo; cão é reservatório; amastigotas dentro de macrófagos", "Febre prolongada, emagrecimento, palidez, esplenomegalia expressiva, hepatomegalia, pancitopenia", "Amastigotas no aspirado de medula; teste rápido rK39 apoia", "Anfotericina B lipossomal (preferencial); suporte nutricional e tratar infecções", "Controle de vetor e proteção individual; notificação semanal"]], ["Leishmaniose tegumentar", "t", ["L. braziliensis, guyanensis e amazonensis; flebotomíneo; formas cutânea e mucosa", "Úlcera crônica; mucosa traz risco maior", "Exame direto, histopatologia, cultura ou PCR, coletando da borda ativa", "Antimoniato de meglumina, miltefosina, anfotericina B lipossomal ou pentamidina; intralesional em lesão localizada selecionada", "Proteção contra flebotomíneos; notificação semanal"]], ["Malária", "t", ["Plasmodium (vivax predomina; falciparum é o grave); Anopheles fêmea inocula esporozoítos", "Febre, calafrios, sudorese, cefaleia, esplenomegalia, anemia, plaquetopenia; alerta: consciência alterada, convulsões, dispneia", "Gota espessa (método central), esfregaço delgado, teste rápido; repetir se a suspeita persistir", "Vivax: cloroquina e depois primaquina ou tafenoquina, após G6PD. Falciparum e mista: artesunato + mefloquina (Nota 1/2026) ou arteméter + lumefantrina. Grave: artesunato IV/IM", "Amazônica: notificação semanal; extra-amazônica: imediata (24 h)"]], ["Doença de Chagas", "t", ["T. cruzi; fezes de triatomíneo entram por pele lesada ou mucosa; também oral, congênita, transfusional", "Aguda: febre, edema, hepatoesplenomegalia, miocardite, sinal de Romaña, chagoma. Crônica: indeterminada, cardíaca ou digestiva", "Aguda: parasito no sangue. Crônica: dois testes sorológicos de princípios diferentes", "Benznidazol (maior benefício na aguda, congênita e em crianças); tratar ara o hipnozoíto do vivax, G6PD antes da primaquina ou tafenoquina. Gota espessa no diagnóstico.", "Vivax: cloroquina + primaquina. Falciparum: ASMQ. Grave: artesunato IV."], ["Doença de Chagas", "t", "Olho inchado de um lado só (Romaña) em fase aguda; sorologia dupla na crônica.", "O barbeiro deixa as fezes, não a saliva: o parasito entra pela ferida da picada. Romaña é o olho de um lado.", "Benznidazol; trate a cardiopatia como decisão separada."], ["Giardíase", "i", "Criança de creche com fezes gordurosas e gases, sem febre.", "Gordura e gases sem sangue. O exame de fezes falha uma vez: repita.", "Tinidazol, metronidazol ou nitazoxanida."], ["Amebíase", "i", "Muco, sangue e tenesmo; febre com dor no hipocôndrio direito sugere fígado.", "Tratamento em duas etapas: o tecido e depois a luz do intestino. Melhorar não é terminar.", "Metronidazol ou tinidazol, seguido de amebicida luminal."]]}, "extra": "", "name": "Parasitoses", "def": 1}, {"title": "IVAS e meningites", "intro": "Tabela comparativa das seis condições do seu material (mais a diferença do líquor entre meningite bacteriana e viral) e, depois dela, fichas de macetes com a pista clínica, um gancho para decorar e o tratamento fechado.", "tsub": "Role para o lado: a coluna do nome fica fixa. Fonte: SP 02, IVAS e meningites.", "D": {"groups": [["a", "Vias aéreas superiores", "#0b7a6b"], ["m", "Meninges", "#b3322a"], ["v", "Vírus respiratórios", "#5b3fa6"]], "cols": ["Condição", "Mecanismo-chave", "Pista clínica", "Sinal de alerta", "Diagnóstico", "Tratamento", "Notificação"], "rows": [["Sinusite", "a", ["Obstrução do complexo ostiomeatal, estase de secreção, proliferação bacteriana e mais edema (ciclo vicioso)", "Dor facial no seio acometido (maxilar: malar e dentes superiores; frontal: piora ao inclinar a cabeça; etmoidal: entre os olhos; esfenoidal: mal localizada), coriza, goteira pós-nasal, hiposmia", "Febre alta e piora depois de melhora inicial; suspeita de complicação orbital ou intracraniana", "Clínico; TC só em complicação ou falha de tratamento", "Sintomático, lavagem salina, corticoide intranasal, descongestionante tópico por no máximo 3 a 5 dias. Bacteriana confirmada: observar até 7 dias; amoxicilina ± clavulanato por 5 a 10 dias; doxiciclina se alergia", "Não"]], ["Meningite", "m", ["Invasão hematogênica e resposta inflamatória meníngea desproporcional, em espaço fechado", "Febre, rigidez de nuca, rebaixamento de consciência e cefaleia; Kernig e Brudzinski; fotofobia, vômitos", "Petéquias e púrpura (meningococcemia); papiledema; no lactente, abaulamento de fontanela", "Punção lombar com líquor (TC antes se houver risco de herniação, sem atrasar o antibiótico); hemocultura", "Bacteriana: ceftriaxona ou cefotaxima + vancomicina + dexametasona junto ou antes; ampicilina se Listeria (maior de 50 anos, imunossupressão, gestação, neonato). Viral: suporte; aciclovir se suspeita de herpes. Criptocócica: anfotericina B + flucitosina, depois fluconazol", "Sim, imediata (24 h); quimioprofilaxia dos contatos no meningococo e no Hib"]], ["COVID-19", "v", ["Spike liga ECA2 com TMPRSS2; possível tempestade de citocinas e estado trombótico", "Febre, tosse seca, mialgia, fadiga; anosmia e disgeusia (mais nas cepas iniciais)", "SpO2 abaixo de 94%; confusão em idosos", "RT-PCR (padrão-ouro); teste antigênico na fase inicial", "Suporte; nirmatrelvir/ritonavir nos de risco, precoce; dexametasona só se oxigênio suplementar", "Reclassificada em maio de 2026: não é mais item isolado"]], ["Rinite alérgica", "a", ["Hipersensibilidade tipo I mediada por IgE", "Espirros em salva, rinorreia hialina, prurido nasal, ocular e de palato, obstrução; sem febre; saudação alérgica e olheiras", "Nenhum emergencial", "Clínico; prick test e IgE específica; mucosa pálida ou azulada", "Corticoide intranasal (mais eficaz) e anti-H1 de segunda geração (loratadina, desloratadina, fexofenadina, cetirizina)", "Não"]], ["Influenza", "v", ["HA e NA com variação antigênica constante (drift e shift)", "Início abrupto, febre alta, mialgia intensa, prostração desproporcional", "Dispneia: pneumonia primária ou bacteriana secundária", "Clínico-epidemiológico; RT-PCR; teste antigênico", "Suporte, sem AAS em crianças e adolescentes; oseltamivir ou zanamivir em grupo de risco ou antes de 48 h", "Não caso a caso; SRAG hospitalizada tem vigilância própria"]], ["Resfriado comum", "v", ["Rinovírus via ICAM-1, replicação ideal a 33 a 35 °C nas fossas nasais", "Início gradual; rinorreia hialina que vira mucopurulenta (não indica bactéria)", "Mais de 10 dias com piora: pensar em sinusite", "Exclusivamente clínico", "Sintomático, lavagem salina, descongestionante tópico curto; sem antibiótico e sem antiviral", "Não"]]], "mac": [["Sinusite", "a", "Dor facial que piora ao inclinar a cabeça, com coriza e obstrução.", "Mapa da dor: bochecha e dentes de cima é maxilar; testa é frontal; entre os olhos é etmoidal; vértex é esfenoidal.", "Sintomático e lavagem salina. Antibiótico só se bacteriana: amoxicilina ± clavulanato."], ["Meningite", "m", "Febre, rigidez de nuca e rebaixamento de consciência. Mancha roxa é meningococo.", "Tríade FNR: Febre, Nuca rígida, Rebaixamento. Líquor turvo, glicose baixa. Não espere o exame para tratar.", "Ceftriaxona + vancomicina + dexametasona junto. Notificar em 24 h."], ["COVID-19", "v", "Anosmia súbita desproporcional à congestão, mais marcante nas cepas iniciais.", "Spike entra pela ECA2; quando a saturação cai abaixo de 94%, o quadro passou para grave.", "Suporte. Nirmatrelvir/ritonavir se risco. Dexametasona só se oxigênio."], ["Rinite alérgica", "a", "Coceira, espirros em salva e coriza clara, sem febre.", "Prurido é a palavra-chave: saudação alérgica e olheira. A mucosa é pálida, não vermelha.", "Corticoide intranasal e anti-H1 de segunda geração."], ["Influenza", "v", "Começa de uma hora para outra com febre alta, dor no corpo e prostração.", "Influenza bate de porta aberta (abrupto); resfriado entra aos poucos.", "Suporte. Oseltamivir em grupo de risco ou antes de 48 h. Sem AAS em crianças."], ["Resfriado comum", "v", "Início gradual, coriza que muda de cor sem febre alta.", "A cor do catarro não é do antibiótico: coriza amarela ou verde é neutrófilo, não bactéria.", "Sintomático. Nenhum antibiótico."]]}, "extra": "<h2 style=\"font-size:24px;margin-top:34px;color:var(--t,#b3322a)\">Líquor: bacteriana contra viral</h2><div class=\"tw\" style=\"margin-top:12px;max-height:none\"><table style=\"min-width:0\"><thead><tr><th>Achado</th><th>Bacteriana</th><th>Viral (asséptica)</th></tr></thead><tbody>\n<tr style=\"--c:#b3322a\"><td>Aspecto</td><td>Turvo, purulento</td><td>Claro</td></tr>\n<tr style=\"--c:#b3322a\"><td>Células</td><td>100 a mais de 5000/mm3, neutrófilos acima de 80%</td><td>10 a 500/mm3, linfomonocitário (nas primeiras 24 a 48 h pode ser neutrofílico)</td></tr>\n<tr style=\"--c:#b3322a\"><td>Proteína</td><td>100 a 500 mg/dL</td><td>Normal ou levemente alta (menos de 100)</td></tr>\n<tr style=\"--c:#b3322a\"><td>Glicose</td><td>Baixa (menos de 40 mg/dL; relação LCR/soro abaixo de 0,4)</td><td>Normal</td></tr>\n<tr style=\"--c:#b3322a\"><td>Agentes por idade</td><td>Neonato: GBS, E. coli, Listeria. Criança: pneumococo, meningococo, Hib. Adulto jovem: meningococo</td><td>Enterovírus é o mais comum; autolimitada</td></tr></tbody></table></div>", "name": "IVAS e meningites", "def": 1}];
const $=s=>document.querySelector(s),X=t=>t.replace(/\{\{(.*?)\}\}/g,'<span class=ext>$1</span>');
let q='',rev=false,cur=0;const S=A.map(a=>({l:a.def,sel:[],x:new Set(),o:new Set()}));
$('#top').innerHTML=A.map((a,i)=>`<button class="tab" data-i="${i}" aria-pressed="${i==cur}">${a.name}</button>`).join('');
function draw(){
 const a=A[cur],D=a.D,s=S[cur],cols=D.cols.slice(1),R=n=>D.rows.find(r=>r[0]==n),col=n=>D.groups.find(g=>g[0]==R(n)[1])[2];
 document.body.className=rev?'rev':'';
 $('#ti').textContent=a.title;$('#in').textContent=a.intro;
 $('#key').innerHTML=D.groups.map(g=>`<span style="--c:${g[2]}"><i></i>${g[1]}</span>`).join('')+'<span class=ext>complemento de livro-texto, não estava no seu HTML</span>';
 $('#lens').innerHTML='<span class="lb">Ver uma coisa de cada vez (toque em uma doença para abrir a ficha completa)</span>'+['Tudo',...cols].map((c,i)=>`<button class="ln" data-l="${i-1}" aria-pressed="${i-1==s.l}">${c}</button>`).join('');
 $('#bd').innerHTML=D.rows.filter(r=>(r[0]+r[2].join(' ')).toLowerCase().includes(q)).map(r=>{const n=r[0];return`<div class="row${s.l<0||s.x.has(n)?' x':''}${s.o.has(n)?' open':''}" data-n="${n}" style="--c:${col(n)}"><div class="nm">${n}</div><div class="vl">${s.l>=0?X(r[2][s.l]):'Ficha completa'}</div><label class="cmp"><input type="checkbox" data-c="${n}"${s.sel.includes(n)?' checked':''}>comparar</label><dl class="all">${cols.map((c,i)=>`<div><dt>${c}</dt><dd>${X(r[2][i])}</dd></div>`).join('')}</dl></div>`}).join('');
 const k=s.sel.length;$('#pill').classList.toggle('hide',k<2);$('#pill').textContent='Ver comparação ('+k+')';
 $('#cmp').innerHTML=k<2?'':`<div class="cbox"><div><span class="lb">Comparando lado a lado</span><button class="ln" id="clr">Limpar</button></div>`+cols.map((c,i)=>`<div class="ca"><div class="lb">${c}</div><div class="cg" style="grid-template-columns:repeat(auto-fit,minmax(${k>2?170:220}px,1fr))">${s.sel.map(n=>`<div style="--c:${col(n)}"><span class="cn">${n}</span>${X(R(n)[2][i])}</div>`).join('')}</div></div>`).join('')+'</div>';
 $('#ex').innerHTML=a.extra;
 $('#mc').innerHTML=D.mac.filter(c=>(c[0]+c[2]+c[3]).toLowerCase().includes(q)).map(c=>`<article class="card${s.o.has('m'+c[0])?' open':''}" data-m="${c[0]}" style="--c:${D.groups.find(g=>g[0]==c[1])[2]}"><h3>${c[0]}</h3><div class="f"><span class="lb">Como reconhecer</span>${X(c[2])}</div><div class="hook"><span class="lb">Gancho para decorar</span>${c[3]}</div><div class="f tx"><span class="lb">Tratamento fechado</span>${X(c[4])}</div></article>`).join('')}
function fit(){const b=$('#fsB'),t=$('#fsT');let f=17;t.style.fontSize=f+'px';while(f>6&&(t.offsetHeight>b.clientHeight||t.offsetWidth>b.clientWidth)){f-=.25;t.style.fontSize=f+'px'}}
function renderFS(){const a=A[cur],D=a.D,gc=Object.fromEntries(D.groups.map(g=>[g[0],g[2]]));
 $('#fst').textContent=a.title;
 $('#fsn').innerHTML=A.map((x,i)=>`<button class="ln" data-f="${i}" aria-pressed="${i==cur}">${x.name}</button>`).join(' ');
 $('#fsT').innerHTML='<thead><tr><th>'+D.cols.join('</th><th>')+'</th></tr></thead><tbody>'+D.rows.map(r=>`<tr style="--c:${gc[r[1]]}"><td>${r[0]}</td>${r[2].map(c=>`<td>${X(c)}</td>`).join('')}</tr>`).join('')+'</tbody>';
 fit()}
function openFS(){$('#fs').classList.add('on');renderFS();try{$('#fs').requestFullscreen&&$('#fs').requestFullscreen()}catch(_){}}
function closeFS(){$('#fs').classList.remove('on');if(document.fullscreenElement)document.exitFullscreen()}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)$('#fs').classList.remove('on');else fit()});
addEventListener('resize',()=>{if($('#fs').classList.contains('on'))fit()});
addEventListener('keydown',e=>{if(e.key=='Escape')closeFS()});
document.addEventListener('click',e=>{const s=S[cur],g=e.target.closest.bind(e.target);
 let b=g('[data-i]');if(b){cur=+b.dataset.i;document.querySelectorAll('[data-i]').forEach(x=>x.setAttribute('aria-pressed',x==b));draw();scrollTo(0,0);return}
 if(e.target.id=='fsb'){openFS();return}
 if(e.target.id=='fsx'){closeFS();return}
 b=g('[data-f]');if(b){cur=+b.dataset.f;document.querySelectorAll('[data-i]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.i==cur));draw();renderFS();return}
 if(e.target.id=='rv'){rev=!rev;e.target.setAttribute('aria-pressed',rev);draw();return}
 if(e.target.id=='clr'){s.sel=[];draw();return}
 b=g('[data-l]');if(b){s.l=+b.dataset.l;draw();return}
 if(g('.cmp'))return;
 b=g('.row');if(b){const n=b.dataset.n,t=rev?s.o:s.x;t.has(n)?t.delete(n):t.add(n);draw();return}
 b=g('.card');if(b&&rev){const n='m'+b.dataset.m;s.o.has(n)?s.o.delete(n):s.o.add(n);draw()}});
document.addEventListener('change',e=>{const c=e.target.dataset.c;if(!c)return;const s=S[cur];
 s.sel=s.sel.filter(n=>n!=c);if(e.target.checked){s.sel.push(c);if(s.sel.length>3)s.sel.shift()}draw()});
$('#q').addEventListener('input',e=>{q=e.target.value.toLowerCase().trim();draw()});
draw();
</script></body></html>
