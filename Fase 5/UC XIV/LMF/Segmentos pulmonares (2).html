<title>Segmentos pulmonares</title>
<style>
:root{--bg:#f3f5f7;--ink:#1b2a3a;--mut:#5d6b7a;--card:#fff;--line:#d5dce3;--acc:#1f5f8b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191f;--ink:#e8edf2;--mut:#9aa7b4;--card:#1d242c;--line:#33404c;--acc:#6db3e0}}
:root[data-theme="dark"]{--bg:#14191f;--ink:#e8edf2;--mut:#9aa7b4;--card:#1d242c;--line:#33404c;--acc:#6db3e0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;padding:16px}
.wrap{max-width:760px;margin:0 auto}
h1{font-family:"Source Serif 4",Georgia,serif;font-size:1.5rem;margin:0 0 4px}
p.s{margin:0 0 12px;color:var(--mut)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--acc)}button:focus-visible,.m:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.cnt{margin-left:auto;font-weight:600}
.stage{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stage img{display:block;width:100%;height:auto}
.m{position:absolute;transform:translate(-50%,-50%);min-width:20px;height:20px;border-radius:10px;border:2px solid #fff;background:#1b2a3a;color:#fff;font:600 10px/16px "Source Sans 3",system-ui,sans-serif;padding:0 4px;text-align:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.45);white-space:nowrap;transition:background .15s}
.m.on{z-index:3;padding:0 6px;color:#111;border-color:#111;z-index:2}
.m.on.dk{color:#fff}
@media(max-width:520px){.m.on{font-size:9px;padding:0 5px}}
</style></head><body><div class="wrap">
<h1>Segmentos pulmonares</h1>
<p class="s">Toque num ponto para ver o nome do segmento. Toque de novo para ocultar.</p>
